name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # `src` only: scripts/ holds a helper named *.test.ts that is not a test suite.
      - run: npx vitest run src

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            ml/requirements.txt
      - run: pip install -r api/requirements.txt -r ml/requirements.txt
      # No DATABASE_URL here: database-backed tests skip (api/tests/conftest.py requires TEST_DATABASE_URL).
      - run: python -m pytest api/tests -q
        env:
          PYTHONPATH: .
      - run: python -m pytest ml/scoring -q
        env:
          PYTHONPATH: .
